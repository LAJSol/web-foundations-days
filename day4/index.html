<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Untitled Note</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Untitled Note</h1>

      <label for="note-text">Write your note</label>
      <textarea
        id="note-text"
        rows="6"
        placeholder="Start typing..."
      ></textarea>
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>

      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
